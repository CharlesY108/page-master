name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager: "pnpm"
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install
        # 依赖安装失败则终止工作流
        if: success()

      - name: 构建项目
        run: pnpm run build
        # 构建失败则终止工作流
        if: success()

      - name: 验证 dist 目录存在（关键检查）
        run: |
          if [ ! -d "dist" ]; then
            echo "错误：构建后未生成 dist 目录！"
            exit 1
          fi
          echo "dist 目录存在，开始部署..."
        if: success()

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        if: success()

      - name: 上传 dist 产物（仅上传构建后文件）
        uses: actions/upload-pages-artifact@v3
        with:
          name: vue-app-pages
          path: "./dist" # 强制只上传 dist 目录
        if: success()

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()