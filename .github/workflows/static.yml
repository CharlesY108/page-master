name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤1：先安装 pnpm（关键：先有 pnpm，再配置缓存）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest # 安装最新版 pnpm
          run_install: false # 暂不安装依赖

      # 步骤2：配置 Node.js（移除 package-manager，只指定版本和缓存类型）
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # 缓存 pnpm 依赖（此时 pnpm 已安装，可正常识别）

      # 步骤3：用 pnpm 安装依赖（此时环境已存在 pnpm）
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
        if: success()

      # 步骤4：构建项目
      - name: 构建项目
        run: pnpm run build
        if: success()

      # 步骤5：验证 dist 目录存在
      - name: 验证 dist 目录存在
        run: |
          if [ ! -d "dist" ]; then
            echo "错误：构建后未生成 dist 目录！"
            exit 1
          fi
          echo "dist 目录存在，开始部署..."
        if: success()

      # 步骤6：配置 Pages
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        if: success()

      # 步骤7：上传 dist 产物
      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          name: vue-app-pages
          path: "./dist"
        if: success()

      # 步骤8：部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()
