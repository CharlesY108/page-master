name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager: "pnpm" # 明确指定 pnpm
          cache: "pnpm" # 缓存 pnpm 依赖（加速构建）

      # 关键步骤：安装 pnpm（GitHub 环境默认没有 pnpm，需手动安装）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4 # pnpm 官方提供的安装动作
        with:
          version: latest # 安装最新版 pnpm（也可指定版本，如 9.0.0）
          run_install: false # 暂不安装依赖，后续手动执行

      - name: 安装项目依赖（用 pnpm）
        run: pnpm install --frozen-lockfile # 锁定依赖版本，避免波动
        if: success()

      - name: 构建项目（用 pnpm）
        run: pnpm run build
        if: success()

      - name: 验证 dist 目录存在
        run: |
          if [ ! -d "dist" ]; then
            echo "错误：构建后未生成 dist 目录！"
            exit 1
          fi
          echo "dist 目录存在，开始部署..."
        if: success()

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        if: success()

      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          name: vue-app-pages
          path: "./dist"
        if: success()

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()