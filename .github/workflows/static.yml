# 工作流名称
name: Deploy Vue App to GitHub Pages

# 触发条件：推送到 main 分支时自动执行，也可手动触发
on:
  push:
    branches: ["main"] # 若你的分支名是 master，替换为 master
  workflow_dispatch:

# 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：避免多次部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取 GitHub 仓库代码
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Node.js 环境（与本地项目 Node 版本一致，如 18、20）
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # 缓存依赖，加速构建

      # 3. 安装项目依赖
      - name: 安装依赖
        run: npm install
        # 若用 yarn，替换为：yarn install --frozen-lockfile
        # 若用 pnpm，替换为：pnpm install --frozen-lockfile

      # 4. 构建 Vue 项目（生成 dist 目录）
      - name: 构建项目
        run: npm run build

      # 5. 配置 GitHub Pages
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 6. 上传构建产物（仅上传 dist 目录，避免冗余文件）
      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # 构建产物目录，Vue 项目默认是 dist

      # 7. 部署到 GitHub Pages
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4