name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤1：先安装 pnpm
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # 步骤2：配置 Node.js
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # 步骤3：安装项目依赖
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
        if: success()

      # 步骤4：构建项目
      - name: 构建项目
        run: pnpm run build
        if: success()

      # 步骤5：验证 dist 目录存在
      - name: 验证 dist 目录存在
        run: |
          if [ ! -d "dist" ]; then
            echo "错误：构建后未生成 dist 目录！"
            exit 1
          fi
          echo "dist 目录存在，开始部署..."
        if: success()

      # 步骤6：配置 Pages
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        if: success()

      # 步骤7：上传 dist 产物（使用默认名称 github-pages）
      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # 删除 name 字段，默认名称就是 github-pages
        if: success()

      # 步骤8：部署到 GitHub Pages（自动识别 github-pages  artifact）
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()
